<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>Calculator</h1>
      <h1 class="myResult" id="myResult">0</h1>
      <br />
      <div class="buttons">
        <button type="button" id="buttonPlus" class="operators" value="+">
          +
        </button>
        <button type="button" id="buttonOne" class="numbers" value="1">
          1
        </button>
        <button type="button" id="buttonTwo" class="numbers" value="2">
          2
        </button>
        <button type="button" id="buttonThree" class="numbers" value="3">
          3
        </button>
        <button type="button" id="buttonMinus" class="operators" value="-">
          -
        </button>
        <button type="button" id="buttonFour" class="numbers" value="4">
          4
        </button>
        <button type="button" id="buttonFive" class="numbers" value="5">
          5
        </button>
        <button type="button" id="buttonSix" class="numbers" value="6">
          6
        </button>
        <button type="button" id="buttonDivide" class="operators" value="/">
          /
        </button>
        <button type="button" id="buttonSeven" class="numbers" value="7">
          7
        </button>
        <button type="button" id="buttonEight" class="numbers" value="8">
          8
        </button>
        <button type="button" id="buttonNine" class="numbers" value="9">
          9
        </button>
        <button type="button" id="buttonMultiply" class="operators" value="*">
          *
        </button>
        <button type="button" id="buttonZero" class="numbers" value="0">
          0
        </button>
        <button type="button" id="buttonDot" class="dot" value=".">.</button>
        <button type="button" id="buttonResult" class="buttonResult" value="=">
          =
        </button>
        <button type="button" id="buttonClear" class="clear" value="C">
          C
        </button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
